name: 'Setup GitHub App Auth'
description: 'Configure GitHub App authentication with automatic installation ID detection'
branding:
  icon: 'lock'
  color: 'blue'

inputs:
  # Single app mode (recommended)
  app-id:
    description: 'GitHub App ID'
    required: false
  private-key:
    description: 'GitHub App private key (PEM format)'
    required: false
  patterns:
    description: |
      Repository prefixes to match (comma-separated, e.g., "github.com/org1/,github.com/org2/").
      Optional: if omitted, uses github.repository_owner for dynamic detection.
      Note: These are string prefixes, not glob patterns. Use "github.com/org/" not "github.com/org/*".
    required: false
  app-name:
    description: 'Friendly name for the GitHub App'
    required: false
    default: 'GitHub App'

  # Multi-app mode (for multiple organizations)
  apps-config:
    description: |
      JSON array of GitHub App configurations for multi-org setup.
      Format: [{"app-id": "123", "private-key": "...", "patterns": "github.com/org/", "app-name": "Org App"}]
      Use prefixes ("github.com/org/") not globs ("github.com/org/*").
      Either specify this OR the individual app-id/private-key inputs.
    required: false

  # Common options
  cleanup-on-exit:
    description: 'Remove credentials from keyring on job completion (important for non-ephemeral runners)'
    required: false
    default: 'true'
  sync-git-config:
    description: 'Automatically sync git credential helper configuration'
    required: false
    default: 'true'
  extension-version:
    description: 'Version of gh-app-auth to install (default: latest from main branch)'
    required: false
    default: ''

outputs:
  config-path:
    description: 'Path to the gh-app-auth configuration file'
    value: ${{ steps.setup.outputs.config-path }}
  cleanup-registered:
    description: 'Whether cleanup hook was registered'
    value: ${{ steps.setup.outputs.cleanup-registered }}

runs:
  using: 'composite'
  steps:
    - name: Install required tools
      shell: bash
      run: |
        # Ensure ~/.local/bin exists and is in PATH
        mkdir -p "$HOME/.local/bin"
        export PATH="$HOME/.local/bin:$PATH"
        echo "$HOME/.local/bin" >> $GITHUB_PATH

        # Install GitHub CLI if not present
        if ! command -v gh &> /dev/null; then
          echo "📦 Installing GitHub CLI (rootless)..."

          # Detect architecture
          ARCH=$(uname -m)
          case $ARCH in
            x86_64) GH_ARCH="amd64" ;;
            aarch64|arm64) GH_ARCH="arm64" ;;
            *) echo "❌ Unsupported architecture: $ARCH"; exit 1 ;;
          esac

          # Download latest GitHub CLI binary
          GH_VERSION=$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest | \
            grep '"tag_name"' | cut -d'"' -f4 | sed 's/^v//')
          GH_URL="https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_${GH_ARCH}.tar.gz"

          echo "   Downloading gh v${GH_VERSION} for ${GH_ARCH}..."
          curl -fsSL "$GH_URL" -o /tmp/gh.tar.gz
          tar -xzf /tmp/gh.tar.gz -C /tmp
          mv "/tmp/gh_${GH_VERSION}_linux_${GH_ARCH}/bin/gh" "$HOME/.local/bin/gh"
          chmod +x "$HOME/.local/bin/gh"
          rm -rf /tmp/gh.tar.gz "/tmp/gh_${GH_VERSION}_linux_${GH_ARCH}"

          echo "✅ GitHub CLI v${GH_VERSION} installed to ~/.local/bin"
        else
          echo "✅ GitHub CLI already installed: $(command -v gh)"
        fi

        # Install jq for JSON parsing (needed for multi-app mode)
        if ! command -v jq &> /dev/null; then
          echo "📦 Installing jq (rootless)..."

          # Detect architecture
          ARCH=$(uname -m)
          case $ARCH in
            x86_64) JQ_ARCH="amd64" ;;
            aarch64|arm64) JQ_ARCH="arm64" ;;
            *) echo "❌ Unsupported architecture: $ARCH"; exit 1 ;;
          esac

          # Download jq binary
          JQ_VERSION="1.7.1"
          JQ_URL="https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/jq-linux-${JQ_ARCH}"

          echo "   Downloading jq v${JQ_VERSION} for ${JQ_ARCH}..."
          curl -fsSL "$JQ_URL" -o "$HOME/.local/bin/jq"
          chmod +x "$HOME/.local/bin/jq"

          echo "✅ jq v${JQ_VERSION} installed to ~/.local/bin"
        else
          echo "✅ jq already installed: $(command -v jq)"
        fi

    - name: Verify tools are in PATH
      shell: bash
      run: |
        echo "🔍 Verifying installed tools are accessible..."

        if ! command -v gh &> /dev/null; then
          echo "❌ Error: gh not found in PATH"
          echo "   PATH: $PATH"
          echo "   Expected location: $HOME/.local/bin/gh"
          ls -la "$HOME/.local/bin/" || true
          exit 1
        fi

        if ! command -v jq &> /dev/null; then
          echo "❌ Error: jq not found in PATH"
          echo "   PATH: $PATH"
          echo "   Expected location: $HOME/.local/bin/jq"
          ls -la "$HOME/.local/bin/" || true
          exit 1
        fi

        echo "✅ gh found at: $(command -v gh)"
        echo "✅ jq found at: $(command -v jq)"

    - name: Install gh-app-auth extension
      shell: bash
      run: |
        echo "📦 Installing gh-app-auth extension..."

        if [ -n "${{ inputs.extension-version }}" ]; then
          gh extension install AmadeusITGroup/gh-app-auth --pin "${{ inputs.extension-version }}"
        else
          gh extension install AmadeusITGroup/gh-app-auth || gh extension upgrade app-auth || true
        fi

        echo "✅ gh-app-auth extension installed"
        gh app-auth --version

    - name: Setup GitHub App authentication
      id: setup
      shell: bash
      run: |
        echo "🔐 Configuring GitHub App authentication..."

        # Determine which mode: single or multi-app
        if [ -n "${{ inputs.apps-config }}" ]; then
          echo "📋 Multi-app mode: Configuring multiple GitHub Apps from JSON"

          # Parse JSON and configure each app
          echo '${{ inputs.apps-config }}' | jq -c '.[]' | while read -r app; do
            app_id=$(echo "$app" | jq -r '."app-id"')
            app_name=$(echo "$app" | jq -r '."app-name" // "GitHub App"')
            patterns=$(echo "$app" | jq -r '.patterns')
            private_key=$(echo "$app" | jq -r '."private-key"')

            echo ""
            echo "🔧 Configuring: $app_name (ID: $app_id)"
            echo "   Patterns: $patterns"

            # Configure app with private key from JSON
            export GH_APP_PRIVATE_KEY="$private_key"
            gh app-auth setup \
              --app-id "$app_id" \
              --patterns "$patterns" \
              --name "$app_name"
            unset GH_APP_PRIVATE_KEY

            echo "✅ Configured: $app_name"
          done

          echo ""
          echo "✅ All GitHub Apps configured"
        else
          echo "📝 Single-app mode: Configuring one GitHub App"

          # Validate required inputs for single-app mode
          if [ -z "${{ inputs.app-id }}" ] || [ -z "${{ inputs.private-key }}" ]; then
            echo "❌ Error: app-id and private-key are required"
            echo "   Or use apps-config for multi-app setup"
            exit 1
          fi

          # Determine patterns: use input or auto-detect from repository owner
          PATTERNS="${{ inputs.patterns }}"
          if [ -z "$PATTERNS" ]; then
            echo "🔍 No patterns specified, using github.repository_owner for auto-detection"
            PATTERNS="github.com/${{ github.repository_owner }}/"
            echo "   Detected prefix: $PATTERNS"
          fi

          # Setup with encrypted storage (keyring)
          export GH_APP_PRIVATE_KEY="${{ inputs.private-key }}"
          gh app-auth setup \
            --app-id "${{ inputs.app-id }}" \
            --patterns "$PATTERNS" \
            --name "${{ inputs.app-name }}"
          unset GH_APP_PRIVATE_KEY

          echo "✅ GitHub App configured"
          echo "   Installation ID: auto-detected"
          echo "   Prefix: $PATTERNS"
        fi

        # Output config path
        config_path="$HOME/.config/gh/extensions/gh-app-auth/config.yml"
        echo "config-path=$config_path" >> $GITHUB_OUTPUT

    - name: Sync git credential helper
      if: inputs.sync-git-config == 'true'
      shell: bash
      run: |
        echo "🔄 Syncing git credential helper configuration..."
        gh app-auth gitconfig --sync --global
        echo "✅ Git credential helper configured"

    - name: Register cleanup hook
      if: inputs.cleanup-on-exit == 'true'
      shell: bash
      run: |
        echo "🧹 Registering cleanup hook for job completion..."

        # Create cleanup script
        cleanup_script="${RUNNER_TEMP}/gh-app-auth-cleanup.sh"
        cat > "$cleanup_script" << 'EOF'
        #!/bin/bash
        echo "🧹 Cleaning up gh-app-auth configuration..."

        # Remove git credential helper configuration
        if command -v gh &> /dev/null && gh extension list | grep -q app-auth; then
          echo "  🗑️  Removing git credential helpers..."
          gh app-auth gitconfig --clean --global 2>/dev/null || true

          echo "  🗑️  Removing app configuration..."
          gh app-auth remove --all --force 2>/dev/null || true
        fi

        echo "✅ Cleanup complete"
        EOF

        chmod +x "$cleanup_script"

        # Register cleanup using GitHub Actions post-job hook
        # The cleanup will run even if the job fails
        echo "$cleanup_script" >> "${RUNNER_TEMP}/cleanup_commands.txt"

        # Also set up trap for immediate cleanup on script exit
        trap "$cleanup_script" EXIT

        echo "cleanup-registered=true" >> $GITHUB_OUTPUT
        echo "✅ Cleanup hook registered"
        echo "   Script: $cleanup_script"

    - name: Verify setup
      shell: bash
      run: |
        echo "✅ Setup complete!"
        echo ""
        echo "📋 Configuration summary:"
        gh app-auth list
        echo ""
        echo "🎯 You can now use git commands with GitHub App authentication:"
        echo "   git clone https://github.com/org/repo"
        echo "   git submodule update --init --recursive"
        echo ""
        if [ "${{ inputs.cleanup-on-exit }}" == "true" ]; then
          echo "🧹 Cleanup is enabled - credentials will be removed on job completion"
        fi

# Post-job cleanup (runs after all steps, even on failure)
# Note: This is a workaround as GitHub Actions doesn't have native post-job hooks
# The cleanup is registered via trap and cleanup_commands.txt
